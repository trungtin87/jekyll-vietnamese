#
# ---------------------------------------------------------------------------------------
# Danh sách các Bộ lọc Liquid được cung cấp bởi Jekyll Core sẽ được sử dụng cho
# tài liệu của chúng.
#
# Để ghi lại một bộ lọc mới, hãy tạo một "mục danh sách" mới bên dưới với các khóa sau:
#   name:           : [BẮT BUỘC] Một nhãn chuỗi xác định bộ lọc
#   description:    : [BẮT BUỘC] Một mô tả ngắn về những gì mong đợi từ bộ lọc
#   version_badge:  : [TÙY CHỌN] Phiên bản Jekyll đã giới thiệu bộ lọc
#   examples:       : [BẮT BUỘC] Một 'danh sách lồng nhau' bao gồm đầu vào và đầu ra
#     input:        : [BẮT BUỘC] Cú pháp và cách sử dụng bộ lọc
#     output:       : [TÙY CHỌN] Đầu ra từ bộ lọc
#
# Mẹo: Sử dụng ký hiệu Khối YAML để "gấp" một chuỗi dài, hoặc để "ngắt" một chuỗi dài
#      sang dòng tiếp theo. Ký hiệu khối cũng có thể được sử dụng để tránh phải sử dụng
#      dấu gạch chéo ngược để thoát dấu ngoặc kép.
# ---------------------------------------------------------------------------------------
#
- name: Relative URL
  description: >-
    Thêm giá trị cấu hình <code>baseurl</code> vào đầu vào để chuyển đổi đường dẫn URL thành URL tương đối.
    Điều này được khuyến nghị cho một trang web được lưu trữ trên một đường dẫn con của một tên miền.
  examples:
    - input: '{{ "/assets/style.css" | relative_url }}'
      output: '/my-baseurl/assets/style.css'

#

- name: Absolute URL
  description: >-
    Thêm giá trị <code>url</code> và <code>baseurl</code> vào đầu vào để chuyển đổi đường dẫn URL thành URL tuyệt đối.
  examples:
    - input: '{{ "/assets/style.css" | absolute_url }}'
      output: 'http://example.com/my-baseurl/assets/style.css'

#

- name: Date to XML Schema
  description: Chuyển đổi Ngày thành định dạng XML Schema (ISO 8601).
  examples:
    - input: '{{ site.time | date_to_xmlschema }}'
      output: '2008-11-07T13:07:54-08:00'

#

- name: Date to RFC-822 Format
  description: Chuyển đổi Ngày thành định dạng RFC-822 được sử dụng cho nguồn cấp dữ liệu RSS.
  examples:
    - input: '{{ site.time | date_to_rfc822 }}'
      output: 'Mon, 07 Nov 2008 13:07:54 -0800'

#

- name: Date to String
  description: Chuyển đổi ngày thành định dạng ngắn.
  examples:
    - input: '{{ site.time | date_to_string }}'
      output: '07 Nov 2008'

#

- name: Date to String in ordinal US style
  description: 'Định dạng ngày thành định dạng số thứ tự, Hoa Kỳ, ngắn.'
  version_badge: 3.8.0
  examples:
    - input: '{{ site.time | date_to_string: "ordinal", "US" }}'
      output: 'Nov 7th, 2008'

#

- name: Date to Long String
  description: Định dạng ngày thành định dạng dài.
  examples:
    - input: '{{ site.time | date_to_long_string }}'
      output: '07 November 2008'

#

- name: Date to Long String in ordinal UK style
  description: 'Định dạng ngày thành định dạng số thứ tự, Vương quốc Anh, dài.'
  version_badge: 3.8.0
  examples:
    - input: '{{ site.time | date_to_long_string: "ordinal" }}'
      output: '7th November 2008'

#

- name: Where
  description: Chọn tất cả các đối tượng trong một mảng mà khóa có giá trị đã cho.
  examples:
    - input: '{{ site.members | where:"graduation_year","2014" }}'
      output:

#

- name: Where Expression
  description: Chọn tất cả các đối tượng trong một mảng mà biểu thức là đúng.
  version_badge: 3.2.0
  examples:
    - input: |-
        {{ site.members | where_exp:"item",
        "item.graduation_year == 2014" }}
      output:
    - input: |-
        {{ site.members | where_exp:"item",
        "item.graduation_year < 2014" }}
      output:
    - input: |-
        {{ site.members | where_exp:"item",
        "item.projects contains 'foo'" }}
      output:

#

- name: Find
  description: >-
    Trả về <strong>đối tượng đầu tiên</strong> trong một mảng mà thuộc tính được truy vấn
    có giá trị đã cho hoặc trả về <code>nil</code> nếu không có mục nào trong
    mảng thỏa mãn tiêu chí đã cho.
  version_badge: 4.1.0
  examples:
    - input: '{{ site.members | find: "graduation_year", "2014" }}'
      output:

#

- name: Find Expression
  description: >-
    Trả về <strong>đối tượng đầu tiên</strong> trong một mảng mà biểu thức đã cho
    đánh giá là đúng hoặc trả về <code>nil</code> nếu không có mục nào trong
    mảng thỏa mãn biểu thức đã đánh giá.
  version_badge: 4.1.0
  examples:
    - input: |-
        {{ site.members | find_exp:"item",
        "item.graduation_year == 2014" }}
      output:
    - input: |-
        {{ site.members | find_exp:"item",
        "item.graduation_year < 2014" }}
      output:
    - input: |-
        {{ site.members | find_exp:"item",
        "item.projects contains 'foo'" }}
      output:

#

- name: Group By
  description: Nhóm các mục của một mảng theo một thuộc tính đã cho.
  examples:
    - input: '{{ site.members | group_by:"graduation_year" }}'
      output: |-
        [{"name"=>"2013", "items"=>[...]},
        {"name"=>"2014", "items"=>[...]}]

#

- name: Group By Expression
  description: Nhóm các mục của một mảng bằng cách sử dụng một biểu thức Liquid.
  version_badge: 3.4.0
  examples:
    - input: |-
        {{ site.members | group_by_exp: "item",
        "item.graduation_year | truncate: 3, ''" }}
      output: |-
        [{"name"=>"201", "items"=>[...]},
        {"name"=>"200", "items"=>[...]}]

#

- name: XML Escape
  description: Thoát một số văn bản để sử dụng trong XML.
  examples:
    - input: '{{ page.content | xml_escape }}'
      output:

#

- name: CGI Escape
  description: >-
    Thoát CGI một chuỗi để sử dụng trong URL. Thay thế bất kỳ ký tự đặc biệt nào
    bằng các thay thế <code>%XX</code> thích hợp. Thoát CGI thường
    thay thế khoảng trắng bằng dấu cộng <code>+</code>.
  examples:
    - input: '{{ "foo, bar; baz?" | cgi_escape }}'
      output: 'foo%2C+bar%3B+baz%3F'

#

- name: URI Escape
  description: >-
    Mã hóa phần trăm bất kỳ ký tự đặc biệt nào trong URI.
    Thoát URI thường thay thế khoảng trắng bằng <code>%20</code>.
    <a href="https://en.wikipedia.org/wiki/Percent-encoding#Types_of_URI_characters">Các ký tự dành riêng</a>
    sẽ không bị thoát.
  examples:
    - input: '{{ "http://foo.com/?q=foo, \bar?" | uri_escape }}'
      output: 'http://foo.com/?q=foo,%20%5Cbar?'

#

- name: Number of Words
  description: >-
    Đếm số lượng từ trong một số văn bản.<br/>
    Từ <span class="version-badge">v4.1.0</span>, bộ lọc này nhận một đối số tùy chọn
    để kiểm soát việc xử lý các ký tự Trung-Nhật-Hàn (CJK)
    trong chuỗi <code>input</code>.<br/>
    Truyền <code>'cjk'</code> làm đối số sẽ đếm mọi ký tự CJK
    được phát hiện là một từ bất kể được phân tách bằng khoảng trắng.<br/>
    Truyền <code>'auto'</code> (tự động phát hiện) hoạt động tương tự như <code>'cjk'</code>
    nhưng hiệu quả hơn nếu bộ lọc được sử dụng trên một chuỗi biến có thể
    hoặc không chứa các ký tự CJK.
  examples:
    - input: '{{ "Hello world!" | number_of_words }}'
      output: 2
    - input: '{{ "你好hello世界world" | number_of_words }}'
      output: 1
    - input: '{{ "你好hello世界world" | number_of_words: "cjk" }}'
      output: 6
    - input: '{{ "你好hello世界world" | number_of_words: "auto" }}'
      output: 6

#

- name: Array to Sentence
  description: >-
    Chuyển đổi một mảng thành một câu. Hữu ích cho việc liệt kê các thẻ.
    Đối số tùy chọn cho trình kết nối.
  examples:
    - input: '{{ page.tags | array_to_sentence_string }}'
      output: 'foo, bar, and baz'
    - input: '{{ page.tags | array_to_sentence_string: "or" }}'
      output: 'foo, bar, or baz'

#

- name: Markdownify
  description: Chuyển đổi một chuỗi được định dạng Markdown thành HTML.
  examples:
    - input: '{{ page.excerpt | markdownify }}'
      output:

#

- name: Smartify
  description: 'Chuyển đổi "quotes" thành &ldquo;smart quotes.&rdquo;'
  examples:
    - input: '{{ page.title | smartify }}'
      output:

#

- name: Converting Sass/SCSS
  description: Chuyển đổi một chuỗi được định dạng Sass hoặc SCSS thành CSS.
  examples:
    - input: '{{ some_sass | sassify }}'
      output:
    - input: '{{ some_scss | scssify }}'
      output:

#

- name: Slugify
  description: Chuyển đổi một chuỗi thành "slug" URL chữ thường. Xem bên dưới để biết các tùy chọn.
  examples:
    - input: '{{ "The _config.yml file" | slugify }}'
      output: 'the-config-yml-file'
    - input: '{{ "The _config.yml file" | slugify: "pretty" }}'
      output: 'the-_config.yml-file'
    - input: '{{ "The _cönfig.yml file" | slugify: "ascii" }}'
      output: 'the-c-nfig-yml-file'
    - input: '{{ "The cönfig.yml file" | slugify: "latin" }}'
      output: 'the-config-yml-file'

#

- name: Data To JSON
  description: Chuyển đổi Hash hoặc Array thành JSON.
  examples:
    - input: '{{ site.data.projects | jsonify }}'
      output:

#

- name: Normalize Whitespace
  description: Thay thế bất kỳ sự xuất hiện nào của khoảng trắng bằng một dấu cách duy nhất.
  examples:
    - input: '{{ "a \n b" | normalize_whitespace }}'
      output:

#

- name: Sort
  description: >-
    Sắp xếp một mảng. Các đối số tùy chọn cho hàm băm
    1.&nbsp;tên thuộc tính
    2.&nbsp;thứ tự nils (<em>first</em> hoặc <em>last</em>).
  examples:
    - input: '{{ page.tags | sort }}'
      output:
    - input: '{{ site.posts | sort: "author" }}'
      output:
    - input: '{{ site.pages | sort: "title", "last" }}'
      output:

#

- name: Sample
  description: 'Chọn một giá trị ngẫu nhiên từ một mảng. Tùy chọn, chọn nhiều giá trị.'
  examples:
    - input: '{{ site.pages | sample }}'
      output:
    - input: '{{ site.pages | sample: 2 }}'
      output:

#

- name: To Integer
  description: Chuyển đổi một chuỗi hoặc boolean thành số nguyên.
  examples:
    - input: '{{ some_var | to_integer }}'
      output:

#

- name: Array Filters
  description: >-
    Push, pop, shift, và unshift các phần tử từ một Mảng.
    Những cái này là <strong>KHÔNG PHÁ HỦY</strong>, tức là chúng không làm thay đổi mảng,
    mà thay vào đó tạo một bản sao và thay đổi bản sao đó.
  examples:
    - input: '{{ page.tags | push: "Spokane" }}'
      output: '["Seattle", "Tacoma", "Spokane"]'
    - input: '{{ page.tags | pop }}'
      output: '["Seattle"]'
    - input: '{{ page.tags | shift }}'
      output: '["Tacoma"]'
    - input: '{{ page.tags | unshift: "Olympia" }}'
      output: '["Olympia", "Seattle", "Tacoma"]'

#

- name: Inspect
  description: Chuyển đổi một đối tượng thành biểu diễn Chuỗi của nó để gỡ lỗi.
  examples:
    - input: '{{ some_var | inspect }}'
      output:
