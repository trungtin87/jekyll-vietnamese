# Các biến được cung cấp bởi Jekyll core
#
#   name:           : tên của biến
#   description:    : nội dung được trả về bởi biến

global:
  - name: site
    description: >-
      Thông tin toàn trang web + cài đặt cấu hình từ <code>_config.yml</code>.
      Xem bên dưới để biết chi tiết.
  - name: page
    description: >-
      Thông tin cụ thể của trang + <a href="/docs/front-matter/">front matter</a>.
      Các biến tùy chỉnh được đặt qua front matter sẽ có sẵn ở đây. Xem bên dưới để biết chi tiết.
  - name: layout
    description: >-
      Thông tin cụ thể của bố cục + <a href="/docs/front-matter/">front matter</a>.
      Các biến tùy chỉnh được đặt qua front matter trong bố cục sẽ có sẵn ở đây.
  - name: jekyll
    description: >-
      Thông tin tập trung vào Jekyll sẽ có sẵn ở đây. Xem bên dưới để biết chi tiết.
  - name: theme
    description: >-
      Thông tin cụ thể của theme-gem như được định nghĩa trong gemspec của giao diện. Hữu ích cho việc hiển thị
      thông tin trong trang "About" của demo giao diện, chẳng hạn. Xem bên dưới để biết chi tiết.
  - name: content
    description: >-
      Trong các tệp bố cục, nội dung được hiển thị của Bài đăng hoặc Trang đang được bao bọc.
      Không được định nghĩa trong các tệp Bài đăng hoặc Trang.
  - name: paginator
    description: >-
      Khi tùy chọn cấu hình <code>paginate</code> được đặt, biến này trở nên khả dụng
      để sử dụng. Xem <a href="../pagination/">Phân trang</a> để biết chi tiết.

site:
  - name: site.time
    description: >-
      Thời gian hiện tại (khi bạn chạy lệnh <code>jekyll</code>).
  - name: site.pages
    description: >-
      Danh sách tất cả các Trang.
  - name: site.posts
    description: >-
      Danh sách tất cả các Bài đăng theo thứ tự thời gian ngược.
  - name: site.related_posts
    description: >-
      Nếu trang đang được xử lý là một Bài đăng, biến này chứa danh sách tối đa mười Bài đăng liên quan.
      Theo mặc định, đây là mười bài đăng gần đây nhất. Để có kết quả chất lượng cao nhưng chậm để tính toán,
      hãy chạy lệnh <code>jekyll</code> với tùy chọn <code>--lsi</code>
      (<a href="https://en.wikipedia.org/wiki/Latent_semantic_analysis#Latent_semantic_indexing">latent semantic indexing</a>).
      Cũng lưu ý rằng GitHub Pages không hỗ trợ tùy chọn
      <code>lsi</code> khi tạo trang web.
  - name: site.static_files
    description: >-
      Danh sách tất cả <a href="/docs/static-files/">các tệp tĩnh</a> (tức là
      các tệp không được xử lý bởi bộ chuyển đổi của Jekyll hoặc trình hiển thị Liquid).
      Mỗi tệp có năm thuộc tính: <code>path</code>, <code>modified_time</code>,
      <code>name</code>, <code>basename</code> và <code>extname</code>.
  - name: site.html_pages
    description: >-
      Một tập con của <code>site.pages</code> liệt kê những trang kết thúc bằng <code>.html</code>.
  - name: site.html_files
    description: >-
      Một tập con của <code>site.static_files</code> liệt kê những tệp kết thúc bằng <code>.html</code>.
  - name: site.collections
    description: >-
      Danh sách tất cả các bộ sưu tập (bao gồm cả bài đăng).
  - name: site.data
    description: >-
      Danh sách chứa dữ liệu được tải từ các tệp YAML nằm trong thư mục <code>_data</code>.
  - name: site.documents
    description: >-
      Danh sách tất cả các tài liệu trong mọi bộ sưu tập.
  - name: site.categories.CATEGORY
    description: >-
      Danh sách tất cả các Bài đăng trong danh mục <code>CATEGORY</code>.
  - name: site.tags.TAG
    description: >-
      Danh sách tất cả các Bài đăng có thẻ <code>TAG</code>.
  - name: site.url
    description: >-
      Chứa url của trang web của bạn như được cấu hình trong <code>_config.yml</code>.
      Ví dụ: nếu bạn có <code>url: http://mysite.com</code> trong tệp cấu hình của mình,
      thì nó sẽ có thể truy cập trong Liquid dưới dạng <code>site.url</code>. Đối với môi trường phát triển
      có <a href="/news/2016/10/06/jekyll-3-3-is-here/#3-siteurl-is-set-by-the-development-server">một
      ngoại lệ</a>, nếu bạn đang chạy <code>jekyll serve</code> trong môi trường phát triển
      <code>site.url</code> sẽ được đặt thành giá trị của <code>host</code>, <code>port</code>,
      và các tùy chọn liên quan đến SSL. Mặc định là <code>url: http://localhost:4000</code>.
  - name: "site.[CONFIGURATION_DATA]"
    description: >-
      Tất cả các biến được đặt qua dòng lệnh và <code>_config.yml</code> của bạn đều có sẵn
      thông qua biến <code>site</code>. Ví dụ: nếu bạn có <code>foo: bar</code> trong
      tệp cấu hình của mình, thì nó sẽ có thể truy cập trong Liquid dưới dạng <code>site.foo</code>.
      Jekyll không phân tích các thay đổi đối với <code>_config.yml</code> trong
      chế độ <code>watch</code>, bạn phải khởi động lại Jekyll để xem các thay đổi đối với biến.

page:
  - name: page.content
    description: >-
      Nội dung của Trang, được hiển thị hoặc chưa được hiển thị tùy thuộc vào Liquid nào đang được xử lý
      và <code>page</code> là gì.
  - name: page.title
    description: >-
      Tiêu đề của tài nguyên Trang hoặc Tài liệu.
  - name: page.excerpt
    description: >-
      Đoạn trích chưa được hiển thị của Trang hoặc Tài liệu. Có thể được ghi đè trong
      <a href="/docs/front-matter/">front matter</a>. Nó có thể bị vô hiệu hóa nguyên tử cho
      một trang hoặc tài liệu nhất định bằng cách đặt một chuỗi rỗng cho khóa <code>excerpt_separator</code> trong
      front matter của tài nguyên mong muốn hoặc bị vô hiệu hóa trên toàn trang web bằng cách đặt giống như một khóa
      cấp cao nhất trong tệp cấu hình.
  - name: page.url
    description: >-
      URL của Bài đăng không có tên miền, nhưng có dấu gạch chéo ở đầu, ví dụ:
      <code>/2008/12/14/my-post.html</code>
  - name: page.date
    description: >-
      Ngày được gán cho Bài đăng. Điều này có thể được ghi đè trong front matter của Bài đăng bằng cách chỉ định
      một ngày/giờ mới theo định dạng <code>YYYY-MM-DD HH:MM:SS</code> (giả sử UTC), hoặc
      <code>YYYY-MM-DD HH:MM:SS +/-TTTT</code> (để chỉ định múi giờ bằng cách sử dụng độ lệch từ UTC.
      ví dụ: <code>2008-12-14 10:30:00 +0900</code>). Không áp dụng cho Trang.
  - name: page.id
    description: >-
      Một định danh duy nhất cho một tài liệu trong Bộ sưu tập hoặc Bài đăng (hữu ích trong nguồn cấp dữ liệu RSS). ví dụ:
      <code>/2008/12/14/my-post</code><code>/my-collection/my-document</code>. Không áp dụng cho
      Trang.
  - name: page.categories
    description: >-
      Danh sách các danh mục mà bài đăng này thuộc về. Các danh mục được lấy từ cấu trúc thư mục
      phía trên thư mục <code>_posts</code>. Ví dụ: một bài đăng tại
      <code>/work/code/_posts/2008-12-24-closures.md</code> sẽ có trường này được đặt thành
      <code>['work', 'code']</code>. Những cái này cũng có thể được chỉ định trong
      <a href="/docs/front-matter/">front matter</a>. Lưu ý: Các danh mục dựa trên đường dẫn có thể không hoạt động cho
      các tài liệu trong các bộ sưu tập do người dùng định nghĩa.
  - name: page.collection
    description: >-
      Nhãn của bộ sưu tập mà Tài liệu thuộc về. ví dụ: <code>posts</code> cho một bài đăng, hoặc
      <code>puppies</code> cho một tài liệu tại đường dẫn <code>_puppies/rover.md</code>. Nếu không phải là một phần của
      bộ sưu tập, một chuỗi rỗng được trả về.
  - name: page.tags
    description: >-
      Danh sách các thẻ mà bài đăng này thuộc về. Những cái này có thể được chỉ định trong
      <a href="/docs/front-matter/">front matter</a>.
  - name: page.dir
    description: >-
      Đường dẫn giữa thư mục nguồn và tệp của một trang, ví dụ: <code>/pages/</code> khi trang
      ở đường dẫn <code>pages/about.md</code> tương đối với thư mục nguồn. Điều này được lấy từ
      thuộc tính <code>url</code> của trang và do đó có thể được ghi đè qua khóa <code>permalink</code>
      trong <a href="/docs/front-matter/">front matter</a>. LƯU Ý: Biến này không áp dụng cho
      bài đăng và tài liệu trong các bộ sưu tập do người dùng định nghĩa. Sử dụng biến <code>categories</code> để lấy thông tin tương tự
      cho bài đăng.
  - name: page.name
    description: >-
      Tên tệp của bài đăng hoặc trang, ví dụ: <code>about.md</code>
  - name: page.path
    description: >-
      Đường dẫn đến bài đăng hoặc trang thô, tương đối với thư mục nguồn. Ví dụ sử dụng: Sử dụng kết hợp
      URL blob của kho lưu trữ và biến trang này để lấy URL đầy đủ đến tệp trong kho lưu trữ.
      Điều này có thể được ghi đè trong <a href="/docs/front-matter/">front matter</a>.
  - name: page.slug
    description: >-
      Tên tệp của tài nguyên Tài liệu không có phần mở rộng (hoặc tiền tố ngày cho bài đăng). Ví dụ:
      slug cho một bài đăng tại URL <code>/2017/02/22/my-new-post.html</code>, sẽ là <code>my-new-post</code>.
      Có thể được ghi đè trong <a href="/docs/front-matter/">front matter</a>.
  - name: page.ext
    description: >-
      Phần mở rộng tệp của tài nguyên Tài liệu. Ví dụ: <code>.html</code>. Có thể được ghi đè trong
      <a href="/docs/front-matter/">front matter</a>.
  - name: page.next
    description: >-
      Bài đăng tiếp theo tương đối với vị trí của bài đăng hiện tại trong <code>site.posts</code>.
      Trả về <code>nil</code> cho mục cuối cùng.
  - name: page.previous
    description: >-
      Bài đăng trước đó tương đối với vị trí của bài đăng hiện tại trong <code>site.posts</code>.
      Trả về <code>nil</code> cho mục đầu tiên.

jekyll:
  - name: jekyll.version
    description: Phiên bản Jekyll được sử dụng để xây dựng trang web.
  - name: jekyll.environment
    description: Giá trị được gán cho biến môi trường <code>JEKYLL_ENV</code> trong quá trình xây dựng.

theme:
  - name: theme.root
    description: >-
      Đường dẫn tuyệt đối đến theme-gem. Chỉ được hiển thị khi biến môi trường <code>JEKYLL_ENV</code>
      được đặt thành <code>development</code>.
  - name: theme.authors
    description: Chuỗi phân tách bằng dấu phẩy bao gồm các tác giả của theme-gem.
  - name: theme.description
    description: Mô tả hoặc tóm tắt của theme-gem như được chỉ định trong gemspec của giao diện. 
  - name: theme.version
    description: Chuỗi phiên bản của giao diện hiện tại.
  - name: theme.dependencies
    description: Danh sách các phụ thuộc thời gian chạy của giao diện.
  - name: theme.metadata
    description: Ánh xạ các cặp khóa-giá trị như được định nghĩa trong gemspec của giao diện. 

paginator:
  - name: paginator.page
    description: Số của trang hiện tại
  - name: paginator.per_page
    description: Số bài đăng trên mỗi trang
  - name: paginator.posts
    description: Các bài đăng có sẵn cho trang hiện tại
  - name: paginator.total_posts
    description: Tổng số bài đăng
  - name: paginator.total_pages
    description: Tổng số trang
  - name: paginator.previous_page
    description: >-
      Số của trang trước đó, hoặc <code>nil</code> nếu không có trang trước đó
  - name: paginator.previous_page_path
    description: >-
      Đường dẫn đến trang trước đó, hoặc <code>nil</code> nếu không có trang trước đó
  - name: paginator.next_page
    description: >-
      Số của trang tiếp theo, hoặc <code>nil</code> nếu không có trang tiếp theo
  - name: paginator.next_page_path
    description: >-
      Đường dẫn đến trang tiếp theo, hoặc <code>nil</code> nếu không có trang tiếp theo
