# Các biến giữ chỗ (placeholders) và định dạng cho permalinks
placeholders:
  - name: year
    desc: >-
      Năm từ tên tệp của bài đăng với bốn chữ số. Có thể được ghi đè qua
      front matter <code>date</code> của tài liệu.
  - name: short_year
    desc: >-
      Năm từ tên tệp của bài đăng không có thế kỷ. (00..99) Có thể được ghi đè qua
      front matter <code>date</code> của tài liệu.
  - name: month
    desc: >-
      Tháng từ tên tệp của bài đăng. (01..12) Có thể được ghi đè qua
      front matter <code>date</code> của tài liệu.
  - name: i_month
    desc: >-
      Tháng không có số 0 ở đầu từ tên tệp của bài đăng. Có thể được ghi đè qua
      front matter <code>date</code> của tài liệu.
  - name: short_month
    desc: >-
      Viết tắt tháng ba chữ cái, ví dụ: "Jan".
  - name: long_month
    intro_ver: "4.0"
    desc: >-
      Tên tháng đầy đủ, ví dụ: "January".
  - name: day
    desc: >-
      Ngày trong tháng từ tên tệp của bài đăng. (01..31) Có thể được ghi đè qua
      front matter <code>date</code> của tài liệu.
  - name: i_day
    desc: >-
      Ngày trong tháng không có số 0 ở đầu từ tên tệp của bài đăng. Có thể được ghi đè qua
      front matter <code>date</code> của tài liệu.
  - name: y_day
    desc: >-
      Ngày thứ tự trong năm từ tên tệp của bài đăng, có số 0 ở đầu. (001..366)
  - name: w_year
    intro_ver: "4.0"
    desc: >-
      Năm tuần có thể khác với năm tháng tối đa ba ngày vào đầu tháng Giêng
      và cuối tháng Mười Hai
  - name: week
    intro_ver: "4.0"
    desc: >-
      Số tuần của năm hiện tại, bắt đầu với tuần đầu tiên có phần lớn các ngày
      trong tháng Giêng. (01..53)
  - name: w_day
    intro_ver: "4.0"
    desc: >-
      Ngày trong tuần, bắt đầu với Thứ Hai. (1..7)
  - name: short_day
    intro_ver: "4.0"
    desc: >-
      Viết tắt ngày trong tuần ba chữ cái, ví dụ: "Sun".
  - name: long_day
    intro_ver: "4.0"
    desc: >-
      Tên ngày trong tuần, ví dụ: "Sunday".
  - name: hour
    desc: >-
      Giờ trong ngày, đồng hồ 24 giờ, có số 0 ở đầu từ front matter <code>date</code> của bài đăng. (00..23)
  - name: minute
    desc: >-
      Phút trong giờ từ front matter <code>date</code> của bài đăng. (00..59)
  - name: second
    desc: >-
      Giây trong phút từ front matter <code>date</code> của bài đăng. (00..59)
  - name: title
    desc: >-
      Tiêu đề từ tên tệp của tài liệu. Có thể được ghi đè qua
      front matter <code>slug</code> của tài liệu. Giữ nguyên chữ hoa chữ thường từ nguồn.
  - name: slug
    desc: >-
      Tiêu đề được slugified từ tên tệp của tài liệu (bất kỳ ký tự nào ngoại trừ số và chữ cái được
      thay thế bằng dấu gạch ngang). Có thể được ghi đè qua front matter <code>slug</code> của tài liệu.
  - name: categories
    desc: >-
      Các danh mục được chỉ định cho bài đăng này. Nếu một bài đăng có nhiều danh mục, Jekyll sẽ tạo
      một hệ thống phân cấp (ví dụ: <code>/category1/category2</code>). Ngoài ra Jekyll tự động phân tích
      các dấu gạch chéo kép trong URL, vì vậy nếu không có danh mục nào, nó sẽ bỏ qua điều này.
  - name: slugified_categories
    intro_ver: "4.1"
    desc: >-
      Các danh mục được chỉ định cho bài đăng này nhưng <em>được slugified</em>. Nếu một danh mục là hợp chất của
      nhiều từ, Jekyll sẽ chuyển tất cả các chữ cái thành chữ thường và thay thế bất kỳ ký tự không phải chữ và số nào
      bằng dấu gạch ngang. (ví dụ: <code>"Work 2 Progress"</code> sẽ được chuyển đổi thành
      <code>"work-2-progress"</code>). Nếu một bài đăng có nhiều danh mục, Jekyll sẽ tạo
      một hệ thống phân cấp (ví dụ: <code>/work-2-progress/category2</code>). Ngoài ra Jekyll tự động phân tích
      các dấu gạch chéo kép trong URL, vì vậy nếu không có danh mục nào, nó sẽ bỏ qua điều này.
  - name: output_ext
    desc: >-
      Phần mở rộng của tệp đầu ra. (Được bao gồm theo mặc định và thường không cần thiết.)

builtin_formats:
  - name: date
    format: "/:categories/:year/:month/:day/:title:output_ext"
  - name: pretty
    format: "/:categories/:year/:month/:day/:title/"
  - name: ordinal
    format: "/:categories/:year/:y_day/:title:output_ext"
  - name: weekdate
    intro_ver: "4.0"
    format: "/:categories/:year/W:week/:short_day/:title:output_ext"
    note: "<code>W</code> sẽ được thêm tiền tố vào giá trị của <code>:week</code>"
  - name: none
    format: "/:categories/:title:output_ext"

types:
  documents:
    - name: collection
      desc: >-
        Nhãn của bộ sưu tập chứa.
    - name: path
      desc: >-
        Đường dẫn đến tài liệu tương đối với thư mục của bộ sưu tập, bao gồm tên tệp cơ sở của tài liệu.
        Tuy nhiên, không bao gồm phần mở rộng tệp.
    - name: name
      desc: >-
        Tên tệp cơ sở của tài liệu nhưng được slugified: chuyển thành chữ thường và mọi chuỗi ký tự không phải chữ và số
        (bao gồm cả khoảng trắng) được thay thế bằng dấu gạch ngang.
    - name: title
      desc: >-
        Nhận giá trị của khóa front matter <code>slug</code> nếu được định nghĩa cho tài liệu. Nếu không, nhận
        giá trị chuỗi được tạo từ tên tệp cơ sở của tài liệu bằng cách chuyển qua phương thức bộ lọc <code>slugify</code>
        với tùy chọn <code>pretty</code>.<br/>
        Bất kể giá trị nào được nhận, chữ hoa chữ thường của các chữ cái được giữ nguyên thay vì được thay thế bằng
        các chữ cái thường tương ứng.
    - name: output_ext
      desc: >-
        Phần mở rộng của tệp đầu ra. (Được bao gồm theo mặc định và thường không cần thiết.)
  pages:
    - name: path
      desc: >-
        Đường dẫn giữa thư mục nguồn và tên tệp cơ sở của trang.
    - name: basename
      desc: >-
        Tên tệp cơ sở của trang.
    - name: output_ext
      desc: >-
        Phần mở rộng của tệp đầu ra. (Được bao gồm theo mặc định và thường không cần thiết.)
