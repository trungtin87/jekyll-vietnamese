# Các tùy chọn cấu hình toàn cục.
- name: Site source
  description: Thay đổi thư mục nơi Jekyll sẽ đọc các tệp
  option: "source: DIR"
  flag: -s, --source DIR


- name: Site destination
  description: Thay đổi thư mục nơi Jekyll sẽ ghi các tệp
  option: "destination: DIR"
  flag: -d, --destination DIR


- name: Safe
  description: >-
    Vô hiệu hóa <a href="/docs/plugins/">các plugin không được đưa vào danh sách trắng</a>, lưu vào bộ nhớ đệm vào đĩa, và bỏ qua các liên kết tượng trưng.
  option: "safe: BOOL"
  flag: --safe


- name: Disable disk cache
  version-badge: 4.1.0
  description: >-
    Vô hiệu hóa việc lưu nội dung vào bộ nhớ đệm vào đĩa để bỏ qua việc tạo thư mục <code>.jekyll-cache</code> hoặc tương tự tại
    nguồn để tránh can thiệp vào môi trường ảo và trình theo dõi thư mục của bên thứ ba. Việc lưu vào bộ nhớ đệm vào đĩa luôn
    bị vô hiệu hóa ở chế độ <code>safe</code>.
  option: "disable_disk_cache: BOOL"
  flag: --disable-disk-cache


- name: Ignore theme configuration
  version-badge: 4.1.0
  description: >-
    Jekyll 4.0 bắt đầu cho phép các giao diện (themes) đóng gói một <code>_config.yml</code> để đơn giản hóa việc giới thiệu giao diện cho người dùng mới.
    Trong trường hợp không may là việc nhập cấu hình giao diện đi kèm làm hỏng cấu hình trang web đã hợp nhất,
    người dùng có thể cấu hình Jekyll để không nhập cấu hình giao diện hoàn toàn.
  option: "ignore_theme_config: BOOL"


- name: Exclude
  description: >-
    Loại trừ các thư mục và/hoặc tệp khỏi quá trình chuyển đổi. Các loại trừ này tương đối với thư mục nguồn của trang web
    và không thể nằm ngoài thư mục nguồn.
    <br />
    Tùy chọn cấu hình này hỗ trợ <a href="https://ruby-doc.org/3.3.5/File.html#method-c-fnmatch">
    các mẫu glob tên tệp <code>File.fnmatch</code></a> của Ruby để khớp với nhiều mục cần loại trừ. Ví dụ,
    bạn có thể loại trừ nhiều tệp README.md trong cây nguồn của mình khỏi việc được đưa vào trang web của mình bằng cách chỉ định
    các mục nhập tùy chọn <code>exclude</code> sau: <code>["README.md", "**/README.md"]</code>.
    <br />
    Trong Jekyll 3, tùy chọn cấu hình <code>exclude</code> thay thế danh sách loại trừ mặc định.
    <br />
    Trong Jekyll 4, các mục nhập do người dùng cung cấp được thêm vào danh sách loại trừ mặc định thay vào đó và tùy chọn <code>include</code>
    có thể được sử dụng để ghi đè các mục nhập danh sách loại trừ mặc định.
    <br />
    Các loại trừ mặc định được tìm thấy trong <code>_config.yml</code> như được tạo bởi <code>jekyll new</code>:
    <ul>
      <li><code>.sass-cache/</code></li>
      <li><code>.jekyll-cache/</code></li>
      <li><code>gemfiles/</code></li>
      <li><code>Gemfile</code></li>
      <li><code>Gemfile.lock</code></li>
      <li><code>node_modules/</code></li>
      <li><code>vendor/bundle/</code></li>
      <li><code>vendor/cache/</code></li>
      <li><code>vendor/gems/</code></li>
      <li><code>vendor/ruby/</code></li>
    </ul>
  option: "exclude: [DIR, FILE, ...]"


- name: Include
  description: >-
    Buộc bao gồm các thư mục và/hoặc tệp trong quá trình chuyển đổi. <code>.htaccess</code> là một ví dụ điển hình vì
    các tệp chấm (dotfiles) bị loại trừ theo mặc định.
    <br>
    Tùy chọn cấu hình này hỗ trợ <a href="https://ruby-doc.org/3.3.5/File.html#method-c-fnmatch-3F">
    các mẫu glob tên tệp <code>File.fnmatch</code></a> của Ruby để khớp với nhiều mục cần bao gồm, tham khảo
    tùy chọn cấu hình <code>exclude</code> để biết thêm thông tin.
    <br>
    Với Jekyll 4, các mục nhập tùy chọn cấu hình <code>include</code> ghi đè các mục nhập tùy chọn <code>exclude</code>.
  option: "include: [DIR, FILE, ...]"


- name: Keep files
  description: >-
    Khi ghi đè đích trang web, hãy giữ lại các tệp đã chọn. Hữu ích cho các tệp không được tạo bởi jekyll;
    ví dụ: các tệp hoặc tài sản được tạo bởi công cụ xây dựng của bạn. Các đường dẫn tương đối với <code>destination</code>.
  option: "keep_files: [DIR, FILE, ...]"


- name: Time zone
  description: >-
    Đặt múi giờ cho việc tạo trang web. Điều này đặt biến môi trường <code>TZ</code>, mà Ruby sử dụng để xử lý
    việc tạo và thao tác thời gian và ngày tháng. Bất kỳ mục nhập nào từ
    <a href="https://en.wikipedia.org/wiki/Tz_database">Cơ sở dữ liệu Múi giờ IANA</a>
    đều hợp lệ, ví dụ: <code>America/New_York</code>. Một danh sách tất cả các giá trị có sẵn có thể được tìm thấy
    <a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones"> tại đây</a>.
    Khi phục vụ trên máy cục bộ, múi giờ mặc định được đặt bởi hệ điều hành của bạn. Nhưng khi được phục vụ trên một máy chủ/host từ xa,
    múi giờ mặc định phụ thuộc vào cài đặt hoặc vị trí của máy chủ.
  option: "timezone: TIMEZONE"


- name: Encoding
  description: >-
    Đặt mã hóa của các tệp theo tên (chỉ khả dụng cho Ruby 1.9 trở lên). Giá trị mặc định là <code>utf-8</code>
    bắt đầu từ 2.0.0, và <code>nil</code> trước 2.0.0, điều này sẽ mang lại mặc định Ruby là <code>ASCII-8BIT</code>.
    Các mã hóa có sẵn có thể được hiển thị bằng lệnh <code>ruby -e 'puts Encoding::list.join("\n")'</code>.
  option: "encoding: ENCODING"
