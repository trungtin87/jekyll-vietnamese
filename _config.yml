# Exclude lib directory from Jekyll build
baseurl: "/jekyll-vietnamese"

exclude:
  - lib/
  - features/
  - test/
  - benchmark/
  - script/
  - rake/
  - rubocop/
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - jekyll.gemspec
  - translate_features.py
  - Earthfile
  - .rubocop.yml
  - .rubocop_todo.yml
  - .jrubyrc
  - .editorconfig
  - .codeclimate.yml
  - .gitignore
  - .gitattributes
  - .devcontainer/
  - exe/
